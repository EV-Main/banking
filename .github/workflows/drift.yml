# HAND-WRITTEN — the only file in this directory that is not generator output.
#
# errors.yml, warnings.yml, other.yml, release-container.yml and the claude*.yml pair
# are written by v_flakes from flake.nix on every `nix develop`; an edit to any of them
# is silently reverted the next time someone enters the shell. v_flakes only ever
# `cp -f`s its own filenames and removes nothing else, so this file survives — but keep
# it thin for that reason. Everything it checks lives in flake.nix under
# `runDriftCheck`, where the reasoning and the toolchain choice are written down.
name: Drift

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  drift:
    name: Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix-env
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Manifest ↔ lock, protos ↔ committed contract
        run: nix run .#drift-check
      # The concierge pin: ancestor of origin/main, proto bytes equal at the pin, on
      # main and in the cargo checkout gen-api just read (contracts/concierge-protos.txt).
      - name: Concierge pin ↔ origin/main ↔ cargo checkout
        run: nix run .#concierge-pin-check
