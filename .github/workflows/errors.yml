    name: drift
    outputs:
      prepare_seconds: ${{ steps.run.outputs['drift_prepare_seconds'] }}
      seconds: ${{ steps.run.outputs['drift_seconds'] }}
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-trees = true
            extra-substituters = https://valeratrades.cachix.org
            extra-trusted-public-keys = valeratrades.cachix.org-1:gXVwhzO5YB+BaiEJYT48qZgzdaErGQew6xtZcz4Fo1Q=
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
