            extra-trusted-public-keys = valeratrades.cachix.org-1:gXVwhzO5YB+BaiEJYT48qZgzdaErGQew6xtZcz4Fo1Q=
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: ev-invest
      - id: eval-cache
        name: Restore nix eval cache
        uses: actions/cache/restore@v5
        with:
          key: nix-eval2-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          path: ~/.cache/nix
      - id: run
        run: nix run .#test -- --severity errors rust-tests
      - if: always() && steps.eval-cache.outputs.cache-hit != 'true' && github.ref_name == github.event.repository.default_branch
        name: Fetch the flake's inputs into the tarball cache
        run: nix flake archive --store "$RUNNER_TEMP/inputs" --option substitute false > /dev/null && chmod -R u+w "$RUNNER_TEMP/inputs" && rm -rf "$RUNNER_TEMP/inputs"
      - if: always() && steps.eval-cache.outputs.cache-hit != 'true' && github.ref_name == github.event.repository.default_branch
