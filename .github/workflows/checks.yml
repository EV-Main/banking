# HAND-WRITTEN — like drift.yml, and not generator output.
#
# errors.yml, warnings.yml, other.yml, release-container.yml and the claude*.yml pair
# are written by v_flakes from flake.nix on every `nix develop`. This file is not, and
# could not be: the generator's rust jobs drive cargo from a dtolnay/rust-toolchain
# runner, and this workspace's `tigerbeetle = { path = ".tb-client" }` only resolves
# inside the dev shell. v_flakes only `cp -f`s its own filenames and removes nothing
# else, so this file survives. Keep it thin — the checks live in flake.nix.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix-env
        with: { rust-cache: rust }
      - name: clippy + tests
        run: nix run .#check-rust

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix-env
      - name: tsc + tests
        run: nix run .#check-frontend
