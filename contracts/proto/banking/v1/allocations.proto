syntax = "proto3";

package banking.v1;

// AllocationsService — the registry of investable products (the Allocation primitive).
//
// An allocation is the control-plane record that makes a service id investable. It is
// the ONLY way one comes into existence: `FundsService.Subscribe` refuses a service
// with no registered, open allocation, so a user can never mint a fund by typing an
// unknown slug. Money never flows through this service — amounts, units and NAV stay
// on FundsService/BalanceService; here live identity, presentation, lifecycle and
// access only.
//
// Lifecycle: `draft` (registered, not yet accepting money) → `open` (subscribe +
// redeem) → `closed` (redeem only, so a closed product never traps an investor).
// `closed` → `open` re-opens. Registration and every transition require
// `AllocationManage` (Admin/Owner) — the same trust seam as posting a valuation.
//
// Access is a second axis, orthogonal to the lifecycle. `state` says whether the
// product takes money at all; `access` says WHO may see it and who may put money in.
// Every allocation carries a default level — `hidden` | `view` | `invest` — and an
// operator may raise one investor above it with a per-user grant (`view` | `invest`).
// The level a caller effectively holds is the higher of the two. A registration lands
// on `view`: visible, but locked until an operator opens it or grants the investor.
//
// Reads are open to any authenticated user, filtered by that effective level:
// `ListAllocations` returns only `open` allocations the caller may at least view, and
// `GetAllocation` answers NOT_FOUND for one the caller may not — unless the caller
// holds `AllocationManage`, who sees everything in every state. `Subscribe` refuses
// (FAILED_PRECONDITION) unless the caller's effective level is `invest`; `Redeem` is
// never gated on access, so locking a product cannot trap an investor. See
// docs/ARCHITECTURE.md.
//
// The one place this service touches supply is `IssueUnits`: an operator minting units
// IN KIND — to an investor — with no cash behind them, for a product registered against
// an asset that already exists and already has owners. It lives here rather than on
// FundsService because it is a registry decision about who holds what, made by the same
// `AllocationManage` holder who sizes the product, not an investor dealing at NAV. The
// holder is always a PERSON: the company is not a holder (#245 — every unit of value is
// somebody's), and a reserved allocation (`fee`) comes to hold a product's fee class
// only through the fee accrual, never through this surface. `RetireUnits` is the mirror
// of `IssueUnits`: a holder's units burnt with no cash leg, supply shrinking by exactly
// that. It is Read-First on what the holder has AVAILABLE (units resting on the book or
// reserved by a redemption cannot be retired), and the burn shows in `ListUnitHolders`
// like any other supply change.
//
// Backing is the third axis. Units minted in kind have no cash in the fund's claim
// behind them, so `Redeem` — which pays cash out of that claim — is refused on a product
// whose `backing` is `in_kind` (FAILED_PRECONDITION); holders exit through the book. The
// first `IssueUnits` flips a product from `cash` to `in_kind` on its own; an operator
// flips it back with `SetAllocationBacking` once the fund does hold cash for the units.
service AllocationsService {
  // The catalog. Any authenticated user sees the `open` allocations they may at least
  // view; an `AllocationManage` holder may set `include_unlisted` to see drafts,
  // closed and hidden ones too. Ordered by `service`.
  rpc ListAllocations(ListAllocationsRequest) returns (AllocationList);

  // One allocation by service id. Readable by any authenticated user in any state —
  // an investor holding units of a closed product still needs to render it — but a
  // product whose effective level for the caller is `hidden` is NOT_FOUND, the same
  // answer an unregistered slug gets, so the catalog cannot be probed for locked
  // products. An `AllocationManage` holder reads any allocation.
  rpc GetAllocation(GetAllocationRequest) returns (Allocation);

  // Register a new allocation in `draft` (AllocationManage). The service id is a
  // 1..64 char `[A-Za-z0-9_-]` slug and is immutable once registered; re-registering
  // an existing one is a conflict, never a silent update.
  rpc RegisterAllocation(RegisterAllocationRequest) returns (Allocation);

  // Update the presentation fields of an existing allocation (AllocationManage).
  // Never changes state or identity.
  rpc UpdateAllocation(UpdateAllocationRequest) returns (Allocation);

  // Drive the lifecycle (AllocationManage): `open` or `close`. Idempotent — setting
  // the state an allocation already holds succeeds and changes nothing.
  rpc SetAllocationState(SetAllocationStateRequest) returns (Allocation);

  // Resize the authorised unit supply (AllocationManage). Idempotent. Separate from
  // UpdateAllocation because this one gates money: `Subscribe` refuses a mint that
  // would carry the issued supply past the cap. A cap below what is already issued is
  // legal and means "no more units" — nothing minted is affected and redemptions are
  // untouched, so this can never strand a holder. Zero is refused: use
  // SetAllocationState(`closed`) to stop new money, which says so in the state.
  rpc SetAllocationUnitCap(SetAllocationUnitCapRequest) returns (Allocation);

  // Set the default access level (AllocationManage): `hidden` | `view` | `invest`.
  // Idempotent. Separate from SetAllocationState because the two answer different
  // questions — `state` is whether the product deals, `access` is who it deals with —
  // and collapsing them would make "open but invite-only" unexpressible. Lowering
  // the default never touches a per-user grant, and never touches redemptions.
  rpc SetAllocationAccess(SetAllocationAccessRequest) returns (Allocation);

  // Declare what stands behind a product's units (AllocationManage): `cash` |
  // `in_kind`. Idempotent. `in_kind` is set automatically by the first `IssueUnits`,
  // never the reverse: this RPC is how an operator says the fund now holds cash for
  // the units and `Redeem` may pay it out again — or corrects a product back to
  // `in_kind`. Lifecycle, access and holdings are untouched.
  rpc SetAllocationBacking(SetAllocationBackingRequest) returns (Allocation);

  // Raise one investor above the default (AllocationManage): `view` | `invest`. A
  // repeat grant for the same user overwrites the level. A grant can only ever add —
  // an investor's effective level is the higher of the default and the grant — so
  // `hidden` is not a level a grant can carry; use Revoke to take one back.
  rpc GrantAllocationAccess(GrantAllocationAccessRequest) returns (AllocationAccessGrant);

  // Take a per-user grant back (AllocationManage). Idempotent — revoking a grant that
  // does not exist succeeds and changes nothing. The investor falls back to the
  // default level; units they already hold are unaffected and still redeemable.
  rpc RevokeAllocationAccess(RevokeAllocationAccessRequest) returns (RevokeAllocationAccessResponse);

  // Every standing grant on one allocation (AllocationManage), ordered by `user_id`.
  rpc ListAllocationAccessGrants(ListAllocationAccessGrantsRequest) returns (AllocationAccessGrantList);

  // Mint units to a holder with no cash leg (AllocationManage). The allocation must be
  // registered, in any state — a product is normally seeded before it opens. The mint
  // is priced at the current (fresh) NAV for the record and the holder's cost basis,
  // and counts against the unit cap exactly as a subscription does: an operator sizing
  // a product below what they mean to issue raises the cap first, then issues.
  //
  // Idempotent by `idempotency_key`, unique per service: a retry of a timed-out call
  // returns the issuance the key already names and mints nothing. A key reused for a
  // DIFFERENT holder or amount is ALREADY_EXISTS — the retry is the case the key exists
  // for, the reuse is the mistake it has to catch.
  rpc IssueUnits(IssueUnitsRequest) returns (UnitIssuance);

  // Burn a holder's units with no cash leg (AllocationManage) — the reverse of
  // IssueUnits: `units` leave the holder's account and the supply shrinks by the same
  // amount. Nothing is paid; this is a cap-table correction,
  // the way an in-kind mint was. The holder must have at least `units` AVAILABLE
  // (Read-First; units resting on the book or reserved by a redemption do not count) —
  // otherwise INVALID_ARGUMENT — and the allocation must be `closed`, because burning a
  // holder's units out of a live product is a decision that deserves a closed door
  // first; `force` is the explicit override for a live product (FAILED_PRECONDITION
  // without it). Priced at the current (fresh) NAV for the record; the default
  // `cost_basis` is `units × NAV`, the book value written off.
  //
  // Answers a `UnitIssuance` with `source = "retire"` and POSITIVE `units`: the row is
  // the magnitude, the source is the direction, and the console lists mints and
  // retirements as one history. Idempotent by `idempotency_key` in the same key space
  // as IssueUnits: the same key naming a mint and then a retirement is ALREADY_EXISTS,
  // not a retry.
  rpc RetireUnits(RetireUnitsRequest) returns (UnitIssuance);

  // The cap table of one product (AllocationManage): the settled supply and every
  // holder of it — people, and the reserved `fee` allocation holding the product's fee
  // class — largest first. Read straight from the ledger — the number an operator
  // checks against the registration before opening a product to the market.
  rpc ListUnitHolders(ListUnitHoldersRequest) returns (UnitHolders);
}

// One registered investable product. Carries no money: units, NAV and positions are
// read from FundsService against the same `service` id.
message Allocation {
  string service = 1;     // the slug — the id used by every FundsService RPC
  string title = 2;       // display name ("EV Trading")
  string summary = 3;     // one-line description for the catalog card
  string state = 4;       // draft | open | closed
  int64 created_at = 5;   // unix seconds
  int64 updated_at = 6;   // unix seconds
  string unit_cap = 7;    // authorised unit supply, decimal (default 100000000)
  // Catalog glyph the client maps onto one of its SVGs. Presentation only. One of:
  // fund | real_estate | trading | yield | venture | treasury | commodity | credit |
  // index | arbitrage. Always populated on a response — `fund` is the default.
  string icon = 8;
  // The product's default access level: hidden | view | invest. What an investor
  // with no grant holds. A registration lands on `view`.
  string access = 9;
  // The level the CALLER effectively holds — the higher of `access` and the caller's
  // own grant, if any. Populated honestly for everyone, an `AllocationManage` holder
  // included: their permission lets them read and administer the product, it does not
  // make them an investor in it, so a manager's `caller_access` says what they would
  // get as one. A client renders the card off `access` and the subscribe control off
  // this — never off `state` alone.
  string caller_access = 10;
  // What stands behind the units: `cash` | `in_kind`. `cash` — the units were paid for
  // into the fund's claim and a redemption pays out of it. `in_kind` — the units stand
  // for an asset the holders own; the fund holds no cash for them, so `Redeem` is
  // refused (FAILED_PRECONDITION) and holders exit through the book. Set to `in_kind`
  // automatically by the first IssueUnits on the product; only SetAllocationBacking
  // takes it back to `cash`. A registration lands on `cash`.
  string backing = 11;
}

// One investor raised above an allocation's default level.
message AllocationAccessGrant {
  string service = 1;
  string user_id = 2;    // the investor (banking user id)
  string level = 3;      // view | invest
  string granted_by = 4; // the AllocationManage holder who granted it
  int64 granted_at = 5;  // unix seconds
}

message AllocationAccessGrantList {
  repeated AllocationAccessGrant grants = 1;
}

message AllocationList {
  repeated Allocation allocations = 1;
}

message ListAllocationsRequest {
  // Include `draft`, `closed` and `hidden` allocations. Requires AllocationManage; a
  // caller without it is refused rather than silently downgraded to the visible list.
  bool include_unlisted = 1;
}

message GetAllocationRequest {
  string service = 1;
}

message RegisterAllocationRequest {
  string service = 1;
  string title = 2;
  string summary = 3;
  // See `Allocation.icon`. Empty means "not chosen" and lands on `fund`; a value
  // outside the set is refused rather than silently defaulted. Deliberately NOT
  // `optional`, unlike the update request: a registration creates the row, so there is
  // no earlier pick that "unset" could destroy — absent and empty both legitimately
  // mean "the operator chose nothing yet", which is what the default is for.
  string icon = 4;
}

message UpdateAllocationRequest {
  string service = 1;
  string title = 2;
  string summary = 3;
  // See `Allocation.icon`. `optional` — and it is the ONLY field here that is, because
  // it is the only one where "the caller did not mention it" has to be distinguishable
  // from "the caller cleared it". Unset means LEAVE THE STORED ICON ALONE; empty string
  // means reset to `fund`; an unknown value is refused.
  //
  // Without presence a scalar `string` cannot tell those apart, and every caller built
  // before this field existed — a consumer repo on an older `contracts` pin, a browser
  // tab holding a stale bundle, a pod mid-rolling-deploy — would silently wipe the
  // operator's pick on the next title edit. `title` and `summary` need no such escape:
  // they predate every live caller, so an omitted title is a client bug the boundary
  // refuses outright rather than a field it has to guess about.
  optional string icon = 4;
}

message SetAllocationStateRequest {
  string service = 1;
  string state = 2;  // open | closed  (draft is entered only by RegisterAllocation)
}

message SetAllocationUnitCapRequest {
  string service = 1;
  string unit_cap = 2;  // decimal units, > 0 (e.g. "1000" or "100000000")
}

message SetAllocationAccessRequest {
  string service = 1;
  string access = 2;  // hidden | view | invest
}

message SetAllocationBackingRequest {
  string service = 1;
  string backing = 2;  // cash | in_kind
}

message GrantAllocationAccessRequest {
  string service = 1;
  string user_id = 2;  // the investor's banking user id
  string level = 3;    // view | invest (never hidden — a grant only ever adds)
}

message RevokeAllocationAccessRequest {
  string service = 1;
  string user_id = 2;
}

message RevokeAllocationAccessResponse {}

message ListAllocationAccessGrantsRequest {
  string service = 1;
}

message IssueUnitsRequest {
  string service = 1;
  // Who receives the units: a banking (or concierge) user id, resolved the way every
  // admin RPC resolves a target. Required — a mint to nobody is a malformed request.
  // Only a person: the company is not a holder (#245), and a reserved allocation is
  // seated by the fee accrual, never by an operator's mint — so there is deliberately no
  // arm for either.
  string user_id = 2;
  // Field 3 was `bool company`, the other arm of a `oneof holder`. Reserved so no later
  // field can inherit its number and be read by an old client as "mint to the company".
  reserved 3;
  reserved "company";
  string units = 4;             // decimal units, > 0
  // Decimal USDT the holder is deemed to have paid. Empty means `units × NAV` at the
  // dealing mark — what a subscription for these units would have cost right now. An
  // explicit value may be anything, zero included: a stake in an asset the holder
  // already owned cost them no cash. This is what lands in their position's cost basis,
  // and so what their P&L and management fee are measured from.
  string cost_basis = 5;
  string idempotency_key = 6;   // required, 1..64 chars, unique per service
}

message RetireUnitsRequest {
  string service = 1;
  // Whose units are burnt: a banking (or concierge) user id, shaped as IssueUnits'
  // holder is and for the same reason. Required — a burn of nobody's units is a
  // malformed request.
  string user_id = 2;
  // Field 3 was `bool company` — see IssueUnitsRequest.
  reserved 3;
  reserved "company";
  string units = 4;             // decimal units, > 0, at most what the holder has available
  // Decimal USDT of book value written off, recorded on the row. Empty means
  // `units × NAV` at the dealing mark, like IssueUnits. No cash moves either way.
  string cost_basis = 5;
  string idempotency_key = 6;   // required, 1..64 chars, unique per service (shared with IssueUnits)
  // Retiring is allowed on a `closed` allocation only; `force = true` is the operator's
  // explicit override to burn units out of a live (draft or open) product.
  bool force = 7;
}

// One in-kind issuance: a mint or a retirement (`source`).
// The holder is a flattened `UnitHolderRef`: a person, or the reserved allocation the
// fee accrual minted a product's fee class to.
message UnitIssuance {
  string id = 1;
  string service = 2;
  // `user` | `allocation`. (The company stake's two historical rows never cross the
  // wire: a lookup that lands on one is refused as a conflict, #245.)
  string holder_kind = 3;
  // The banking user id for `user`; the holding allocation's slug (`fee`) for
  // `allocation`. A client must never resolve an `allocation` holder as a user.
  string holder_id = 4;
  string units = 5;           // decimal units minted or retired (always positive)
  string nav = 6;             // decimal USDT per unit the issuance was recorded at
  string cost_basis = 7;      // decimal USDT
  // `queued` until the relay posts the leg, then `applied`. A client that needs the
  // units to be visible on the ledger polls for `applied`; a `queued` row is one the
  // relay has not reached yet (or one it parked — see BalanceService.ListParkedEvents).
  string state = 8;
  int64 created_at = 9;       // unix seconds
  // Where the units came from — or went: `mint` (IssueUnits or an executed holder
  // grant — supply grew by `units`) or `retire` (RetireUnits — burnt out of the
  // holder's account, supply shrank by `units`). `units` is always the magnitude; the
  // source is the direction.
  // Always populated; a row that predates the field reads as `mint`.
  string source = 10;
}

message ListUnitHoldersRequest {
  string service = 1;
}

// One holder of an allocation's units, as the cap table and the treasury name them.
// `kind` is `user` (`id` is the banking user id) or `allocation` (`id` is the holding
// allocation's slug — the reserved `fee` allocation holding a product's fee class). The
// reserved allocations' own holders are always people.
message UnitHolderRef {
  string kind = 1;  // user | allocation
  string id = 2;
}

// One line of a cap table: who, and how many units (decimal). Holdings of zero are not
// listed.
message UnitHolding {
  UnitHolderRef holder = 1;
  string units = 2;
}

// The cap table of one product: the settled supply and every holder of it, largest
// first (ties by the holder's stored identity, so the table reads the same on every
// refresh). Σ `holders[].units` = `units_outstanding` is the supply invariant the
// reconciliation checks — it is read, never derived, here. All units decimal.
message UnitHolders {
  string service = 1;
  string units_outstanding = 2;
  // Fields 3..5 were the pre-#245 three-class summary (`company_units`, `fee_units`,
  // `investor_units`). Reserved: the table names its holders now.
  reserved 3, 4, 5;
  reserved "company_units", "fee_units", "investor_units";
  // Decimal units of `mint` issuances still `queued` — recorded, not yet posted by the
  // relay. Once they land, `units_outstanding` grows by this much, so an operator
  // pinning the cap to what is issued must wait for it to read zero: a cap pinned to
  // the settled figure alone leaves the queued mint to land above it.
  // TODO(#271): retire (PR #278) shrinks supply — subtract queued retires once it lands.
  string queued_units = 6;
  repeated UnitHolding holders = 7;
}
