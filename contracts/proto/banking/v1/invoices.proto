syntax = "proto3";

package banking.v1;

// InvoicePaymentService — the payer's side of an invoice a scope issued
// (`scope.v1.InvoiceService`). The user opens it from the scope's link in the wallet
// page or the `<ev-pay-invoice>` element and pays it straight into the scope's
// account from `main` or from their compartment in that scope — no move between
// compartments first. Every RPC acts on the caller's own `sub`.
service InvoicePaymentService {
  // The invoice as the payer sees it. Unknown ids and invoices restricted to another
  // payer are the SAME NOT_FOUND.
  rpc GetPayableInvoice(GetPayableInvoiceRequest) returns (PayableInvoice);

  // Pay an OPEN invoice. FAILED_PRECONDITION when it is no longer open, or when the
  // chosen source cannot cover it. A repeat with the same `idempotency_key` returns
  // the paid invoice; paying it again under a new key is FAILED_PRECONDITION.
  rpc PayInvoice(PayInvoiceRequest) returns (PayableInvoice);
}

message GetPayableInvoiceRequest {
  string invoice_id = 1;
}

message PayableInvoice {
  string invoice_id = 1;
  string scope = 2;           // who asks for the money
  string display_name = 3;    // the scope's human name
  string amount = 4;          // decimal USDT
  string memo = 5;            // the scope's text, plain
  string state = 6;           // open | paid | cancelled | expired
  int64 expires_at = 7;       // unix seconds
  int64 paid_at = 8;          // unix seconds, once paid
  string paid_from = 9;       // once paid: `main` or the scope
  // What the caller could pay from right now, decimal USDT: their `main` available
  // balance and their available balance in this scope's compartment.
  string available_main = 10;
  string available_scope = 11;
}

message PayInvoiceRequest {
  string invoice_id = 1;
  string pay_from = 2;         // `main`, or the invoice's scope (the caller's compartment there)
  string idempotency_key = 3;  // client-minted, one per click
}
