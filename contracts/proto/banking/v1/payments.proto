syntax = "proto3";

package banking.v1;

// PaymentsService — the ORDER that moves money between two named ends of the platform.
//
// Two tiers on one order, DERIVED from the destination and never supplied: an external
// wallet address (L1, settled by the withdrawal saga), an internal claim (L3, one posted
// transfer). See domain/src/payments.rs for the aggregate.
//
// AUTHORIZATION IS A FUNCTION OF THE SOURCE. A payment out of an investor's own claim
// (`user:<id>`) is answered by THAT investor, signed in, over PaymentConfirmationService.
// A payment out of banking's treasury (`treasury`, D17) needs the owners' approval at every
// tier: a concierge approval of kind `bank:payment`, proposed in the initiator's name, which
// needs their access token of the last two minutes in `x-ev-user-token`. There is
// deliberately no cell in which one admin moves the treasury alone. The treasury is never
// a destination; as a source it is CLOSED until its spending is decided by concierge's
// scope approvals (`bank:treasury_surplus`, D24) — OpenPayment out of it is
// FAILED_PRECONDITION `treasury spending waits for scope approvals`.
//
// IMMUTABILITY. There is no edit RPC. `payload_hash` binds the approval to the exact terms
// shown to the approver; changing anything means cancel and reopen.
service PaymentsService {
  // Open a payment order (Admin/Owner). Refused when the source cannot cover the amount
  // right now, when the shape could never execute (an unconfigured rail, a sub-minimum
  // external amount, the treasury as a destination), or when the source is the treasury
  // (closed, D24).
  rpc OpenPayment(OpenPaymentRequest) returns (Payment);

  // The payment history, newest first, filtered (Admin/Owner). Nothing is ever deleted.
  rpc ListPayments(ListPaymentsRequest) returns (PaymentList);

  // One order in full (Admin/Owner).
  rpc GetPayment(GetPaymentRequest) returns (Payment);

  // Withdraw an order the CALLER opened, while it is still pending. Anyone else is refused.
  rpc CancelPayment(CancelPaymentRequest) returns (Payment);
}

// PaymentConfirmationService — the investor's side of a payment out of THEIR claim, signed in.
// Behind the user-auth layer: the caller is the subject, and an order that is not theirs, has
// no such seat or does not exist is the same NOT_FOUND. The session is the credential,
// and the wallet host's gate asks for a fresh login before an approval (a decline asks for none).
service PaymentConfirmationService {
  // The caller's orders waiting for their answer, newest first.
  rpc ListPaymentConfirmations(ListPaymentConfirmationsRequest) returns (PaymentConfirmationList);

  // One order as its subject may see it, whatever state it is in.
  rpc GetPaymentConfirmation(GetPaymentConfirmationRequest) returns (PaymentConfirmation);

  // Answer: APPROVE or REJECT. Idempotent for the same answer; a different one after an
  // answer is ALREADY_EXISTS. An approval is gated like any money the caller moves (revoked
  // tokens, the operator's pause, a frozen account) and executed at once; a failure in the
  // execution is the order's to record and does not undo the answer. A seat whose pins have
  // moved (the caller's sessions were revoked, or their mailbox changed, since the order
  // opened) fails the order closed and answers ALREADY_EXISTS with the reason.
  rpc AnswerPaymentConfirmation(AnswerPaymentConfirmationRequest) returns (PaymentConfirmation);
}

// Where an order stands. Terminal everywhere except PENDING and APPROVED.
enum PaymentState {
  PAYMENT_STATE_UNSPECIFIED = 0;
  // Recorded, awaiting its one approval.
  PAYMENT_STATE_PENDING = 1;
  // Approved; for L3 the source is reserved. The effect does not exist yet.
  PAYMENT_STATE_APPROVED = 2;
  // The effect exists: a withdrawal (L1) or a settled transfer (L3).
  PAYMENT_STATE_EXECUTED = 3;
  // Approved, but the effect could not be created. `failure_reason` says why. Nothing
  // retries silently; an L3 reservation is released.
  PAYMENT_STATE_EXECUTION_FAILED = 4;
  // The approver refused, or their consent was voided.
  PAYMENT_STATE_REJECTED = 5;
  // The 72h window closed with no answer.
  PAYMENT_STATE_EXPIRED = 6;
  // The initiator withdrew it.
  PAYMENT_STATE_CANCELLED = 7;
}

// What the investor answered.
enum ConsentDecision {
  CONSENT_DECISION_UNSPECIFIED = 0;
  CONSENT_DECISION_PENDING = 1;
  CONSENT_DECISION_APPROVE = 2;
  CONSENT_DECISION_REJECT = 3;
}

// One end of a payment, as a REQUEST names it.
message Party {
  // user | treasury. `treasury` is banking's own (D17), never a destination, and closed as
  // a source until concierge's scope approvals decide its spending (D24); its id is empty
  // or `main:treasury`.
  string kind = 1;
  // For `user`, the CONCIERGE user id the console carries (resolved to the money-plane id here; a banking id is
  // accepted as a fallback, the way UsersService.GetUserBalance resolves one).
  string id = 2;
}

message ExternalDestination {
  // Rail the payment ships on (BEP20 / POLYGON / TRC20 / TON).
  string network = 1;
  // Destination address, rendered in FULL wherever a human approves it.
  string address = 2;
}

// Where a payment lands. An external SOURCE is unrepresentable on purpose: money cannot
// arrive from an address by anyone's say-so — that is a deposit, which a chain watcher
// attests.
message PaymentDestination {
  oneof target {
    Party internal = 1;
    ExternalDestination external = 2;
  }
}

// One end of a payment, as a RESPONSE describes it. `label` is the wording every approval
// surface shares; the structured
// fields let a screen link to the account.
message PaymentEnd {
  string label = 1;
  // user | treasury, or `external` for an address.
  string kind = 2;
  // The MONEY-PLANE user id (the request accepts a concierge id; the
  // response carries what the order stored). Empty for addresses.
  string id = 3;
  // Set only when `kind` is `external`.
  string network = 4;
  string address = 5;
  // What a person recognises this end BY, beside the label: the receiving investor's
  // MASKED mailbox for `user`. Empty otherwise. Never
  // part of the digest — the label is what an approval binds.
  string detail = 6;
}

message Payment {
  string id = 1;
  PaymentState state = 2;
  // internal | external — DERIVED from the destination, never supplied.
  string tier = 3;
  PaymentEnd source = 4;
  PaymentEnd destination = 5;
  // Decimal USDT string, as everywhere else on this wire.
  string amount = 6;
  // Why, in the initiator's words. Required, shown verbatim, never interpreted.
  string reason = 7;
  // owner_consilium | subject_consent — the one requirement, read off the source.
  string requirement = 8;
  // Hex SHA-256 over the canonical terms, re-verified at execution.
  string payload_hash = 9;
  string initiator_email = 10;
  reserved 11, 12;
  reserved "consilium_id", "consent";
  int64 created_at = 13;
  int64 expires_at = 14;
  // Unix seconds; 0 while pending.
  int64 decided_at = 15;
  // Set on EXECUTED for an external order only: an internal one settled as a ledger
  // transfer and records no id of its own.
  string executed_withdrawal_id = 16;
  string failure_reason = 17;
  // Monotonic per order.
  uint64 version = 18;
  // The seat that decides the order: `concierge_approval` (a `bank:payment` approval) or
  // `session` (the investor's answer in the wallet host).
  string seat = 19;
  // Concierge's id of the approval, once banking has opened it; set for `concierge_approval`.
  string approval_id = 20;
  // The investor's own answer, set for `session`.
  ConsentDecision session_decision = 21;
}

message PaymentList {
  repeated Payment items = 1;
}

message OpenPaymentRequest {
  Party source = 1;
  PaymentDestination destination = 2;
  // Decimal USDT string.
  string amount = 3;
  // Required. Bounded at 500 bytes, no control characters; it is INSIDE the hashed
  // payload the approver signs.
  string reason = 4;
}

message ListPaymentsRequest {
  // 0 means the server default.
  uint32 limit = 1;
  // UNSPECIFIED means every state.
  PaymentState state = 2;
  // Either end. Unset means every party.
  Party party = 3;
  // Only orders whose source is banking's treasury — the ones the owners gate.
  bool fund_owned_only = 4;
}

message GetPaymentRequest {
  string payment_id = 1;
}

message CancelPaymentRequest {
  string payment_id = 1;
}

// One order as the investor it spends is shown it: the terms they answer and nothing about
// the operator beyond a masked address.
message PaymentConfirmation {
  string payment_id = 1;
  PaymentState state = 2;
  string tier = 3;
  PaymentEnd source = 4;
  PaymentEnd destination = 5;
  string amount = 6;
  string reason = 7;
  // Hex SHA-256 over the canonical terms the answer binds to.
  string payload_hash = 8;
  // Who opened it, masked.
  string initiator_email = 9;
  int64 expires_at = 10;
  // This seat's own answer; PENDING until they give one.
  ConsentDecision decision = 11;
  // True when one of the pins recorded at open has moved: the order can no longer be
  // answered or executed.
  bool invalidated = 12;
  string failure_reason = 13;
}

message PaymentConfirmationList {
  repeated PaymentConfirmation items = 1;
}

message ListPaymentConfirmationsRequest {}

message GetPaymentConfirmationRequest {
  string payment_id = 1;
}

message AnswerPaymentConfirmationRequest {
  string payment_id = 1;
  // APPROVE or REJECT. PENDING is rejected as an invalid argument.
  ConsentDecision decision = 2;
  // Audit only — the edge supplies these; they are never trusted for authorization.
  string client_ip = 3;
  string user_agent = 4;
}
