[package]
name = "evbanking_contracts"
version = "0.1.0"
edition = "2024"
description = "gRPC wire contracts for the EV banking hub — generated tonic client+server stubs. The dependency other service repos import by git, alongside evbanking_auth for the verify flow."
license = "BlueOak-1.0.0"
publish = false

# used by the code tonic-prost-build generates into OUT_DIR, which machete doesn't read
[package.metadata.cargo-machete]
ignored = ["prost", "tonic-prost"]

[dependencies]
prost.workspace = true
tonic.workspace = true
tonic-prost.workspace = true

[build-dependencies]
tonic-prost-build.workspace = true

[lints]
workspace = true
